name: 🔗 AutoCorrect 空格语法检查

on:
  repository_dispatch:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: autocorrect-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: AutoCorrect
    runs-on: ubuntu-latest

    steps:
      - name: Checkout from repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install nodejs dependencies
        run: yarn add autocorrect-node

      # 仅检查纳入版本控制的 Markdown，避免扫描 en/、script/ 与本地产物；
      # 违规即失败，不再以 || true 吞掉退出码
      - name: Run autocorrect lint
        run: yarn autocorrect --config .autocorrectrc --lint --no-diff-bg-color $(git ls-files '*.md')

      - name: Run autocorrect fix
        run: yarn autocorrect --config .autocorrectrc --fix $(git ls-files '*.md')

      - name: Markdown add spaces
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "Markdown add spaces"
          labels: "Markdown"
          delete-branch: true
          title: Markdown add spaces
          body: 格式化——Markdown 自动加空格
